<script>

const TELA_PEQ=Math.min(screen.width,screen.height)<900;
let LAYOUT='pc';try{LAYOUT=localStorage.getItem('layout_br26')||'pc'}catch(e){}
function aplicarLayout(){const vp=document.getElementById('vp');if(!vp)return;
 if(TELA_PEQ&&LAYOUT==='pc')vp.setAttribute('content','width=1280');else vp.setAttribute('content','width=device-width,initial-scale=1,viewport-fit=cover')}
aplicarLayout();
function trocarLayout(){LAYOUT=LAYOUT==='pc'?'cel':'pc';try{localStorage.setItem('layout_br26',LAYOUT)}catch(e){}aplicarLayout();render();scrollTo(0,0)}
const fmt=(n,d)=>n==null||isNaN(n)?'–':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(n,d)=>n==null||isNaN(n)?'–':(n>1e-7?'+':n<-1e-7?'−':'')+fmt(Math.abs(n),d);
const eur=v=>v==null?'–':v>=1e6?'€ '+fmt(v/1e6,1)+' mi':'€ '+fmt(v/1e3,0)+' mil';
const pct=p=>p==null?'–':Math.round(p*100);
const faixa=p=>p==null?'na':p>=.7?'hi':p<=.3?'lo':'mid';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DICA={posse_e_construcao:'posse, passes e precisão',jogo_direto:'lançamentos longos por passe',ataque_pelas_pontas:'ações de Ponta/Lateral, gols pela faixa larga, cruzamentos',pressao_alta:'PPDA, posse recuperada no terço de ataque, perdas forçadas no rival',dominio_territorial:'participação nos passes de terço final do jogo (field tilt)',bola_parada:'escanteios, faltas sofridas no terço final, gols de bola parada',bola_na_frente:'bolas enfiadas (through balls)',ataque_a_linha:'impedimentos por jogo',seguranca_com_bola:'perdas de posse e erros que viram chute/gol (menos = melhor)',volume_ofensivo:'xG, finalizações, toques na área',solidez_defensiva:'xG e chances sofridas (menos = melhor)',finalizacao_vs_xg:'gols acima do xG',goleiro_vs_xgot:'gols sofridos abaixo do esperado'};

function golsPage(t){

const det=g?`<div style="font-size:15px;font-weight:600;margin:4px 0 2px">${g.mn}' · ${esc(g.j)}${g.gc?' (gol contra)':''} — ${esc(NM[g.mand])} ${esc(g.pl)} ${esc(NM[g.vis])} · rodada ${g.rd}</div><div class="sub">${g.sit}${g.a?' · assistência de '+esc(g.a):''}${g.pc?' · '+esc(g.pc):''}${g.xg!=null?' · xG '+fmt(g.xg,2):''}${g.dist!=null?' · '+fmt(g.dist,0)+' m do gol':''}${g.ac.length?' · '+(n=>n+(n===1?' ação':' ações')+' do time')(g.ac.filter(q=>q[6]===1).length):''}</div>`:'';
return `<div class="row"><div class="card" style="flex:0 1 380px;max-width:100%"><h2>Gols</h2><div class="sub">Escolha o tipo de lance e clique num gol para ver o passo a passo.</div><div style="display:flex;gap:8px;margin-top:12px"><button class="tab gv" data-v="f" aria-pressed="${S.gv==='f'}" style="flex:1">Feitos (${D.gols.filter(x=>x.f===t.id).length})</button><button class="tab gv" data-v="s" aria-pressed="${S.gv==='s'}" style="flex:1">Sofridos (${D.gols.filter(x=>x.s===t.id).length})</button></div><div style="display:flex;gap:8px;margin-top:10px"><select id="gr" aria-label="Rodada" style="flex:0 0 42%;min-width:0"><option value="">Todas as rodadas</option>${rods.map(x=>`<option value="${x}"${String(x)===String(S.gr)?' selected':''}>Rodada ${x}</option>`).join('')}</select><select id="gs" aria-label="Situação do gol" style="flex:1;min-width:0"><option value="">Todas as situações</option>${sits.map(x=>`<option${x===S.gs?' selected':''}>${x}</option>`).join('')}</select></div>${S.gr||S.gs?`<div class="sub" style="margin-top:6px">${lst.length} gol${lst.length===1?'':'s'} no filtro · <button class="tab glimpa" style="min-height:28px;font-size:12px;padding:0 8px">limpar filtros</button></div>`:''}<div id="glist" data-keep="1" style="max-height:560px;overflow:auto;margin-top:6px;position:relative">${li||'<div class="note">Nenhum gol.</div>'}</div></div>
<div class="card" style="flex:1 1 600px;min-width:0"><h2>Passo a passo do gol</h2>${det}<div style="margin-top:12px">${pitchSvg(g)}</div>${g?participantes(g):''}<div class="leg"><span><i style="background:#2563C9"></i>ação do time (nº = ordem)</span><span><i style="background:#C8561A"></i>ação do adversário</span><span><i style="background:#FFE066"></i>finalização</span><span><i style="background:#9AA0A6;border-radius:3px"></i>goleiro</span><span>— passe · - - cruzamento · ··· condução</span></div><div class="note">Coordenadas normalizadas: o time do gol sempre ataca para a direita, então o lado esquerdo dele fica em cima e o direito embaixo. Conferido com os laterais e pontas: Alex Sandro, Ayrton Lucas e Samuel Lino aparecem em cima; Varela, Emerson Royal e Carrascal, embaixo.</div></div></div>
<div class="card"><h2>Como o time ${S.gv==='f'?'faz':'sofre'} seus gols</h2><div class="sub">${base.length} gols · média de ${fmt(base.reduce((s,x)=>s+x.ac.filter(q=>q[6]===1).length,0)/Math.max(1,base.length),1)} ações por gol · ${fmt(t.kpi.bola_parada*100,0)}% de bola parada e ${fmt(t.kpi.contra*100,0)}% em contra-ataque (gols feitos).</div>${resumo}</div>`}
const CORES={'Flamengo':['#C8102E','#111111'],'Palmeiras':['#006437','#FFFFFF'],'Cruzeiro':['#0033A0','#FFFFFF'],'Vasco da Gama':['#111111','#D71920'],'Atlético Mineiro':['#111111','#FFFFFF'],'Fluminense':['#7A1F3D','#00613C'],'Grêmio':['#0D80BF','#111111'],'Santos':['#111111','#FFFFFF'],'Bahia':['#0057A8','#D7182A'],'Red Bull Bragantino':['#D7182A','#FFFFFF'],'São Paulo':['#D7182A','#111111'],'Athletico':['#C8102E','#111111'],'Botafogo':['#111111','#FFFFFF'],'Internacional':['#C8102E','#FFFFFF'],'Vitória':['#C8102E','#111111'],'Coritiba':['#00543C','#FFFFFF'],'Remo':['#0B1F5C','#FFFFFF'],'Mirassol':['#F5C400','#00613C'],'Corinthians':['#111111','#FFFFFF'],'Chapecoense':['#00843D','#FFFFFF']};
const lum=h=>{const n=parseInt(h.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;return .2126*r+.7152*g+.0722*b};
function tema(t){const [a,b]=CORES[t.nome]||['#2563C9','#FFFFFF'];const dark=matchMedia('(prefers-color-scheme: dark)').matches;const ac=dark&&lum(a)<.12?'#E8E6DF':a;const st=document.documentElement.style;st.setProperty('--team',ac);st.setProperty('--team2',b);st.setProperty('--teamfg',lum(ac)>.55?'#111':'#fff')}
const sigla=n=>n.split(/[\s-]+/).filter(w=>w.length>2||/^[A-Z]/.test(w)).slice(0,3).map(w=>w[0]).join('').toUpperCase();
function rankKpi(key,dir){const v=D.times.map(x=>x.kpi[key]).filter(x=>x!=null);const me=D.times.find(x=>x.id===S.id).kpi[key];return 1+v.filter(x=>dir>0?x>me:x<me).length}
function zonas(v){if(!v)return null;let T=[0,0,0],C=[0,0,0],s=0;for(let x=0;x<12;x++)for(let y=0;y<8;y++){const q=v[x*8+y];s+=q;T[Math.floor(x/4)]+=q;C[y<3?0:y<5?1:2]+=q}return {T:T.map(q=>q/s),C:C.map(q=>q/s)}}
function jogoTexto(t){const z=zonas(t.calor),k=t.kpi,L=D.liga;if(!z)return '';const Lz=D.times.map(x=>zonas(x.calor)).filter(Boolean);const avg=(f,i)=>Lz.reduce((a,q)=>a+q[f][i],0)/Lz.length;const rk=(f,i)=>1+Lz.filter(q=>q[f][i]>z[f][i]).length;const p=x=>Math.round(x*100)+'%';const lados=['direito','central','esquerdo'],li=z.C.indexOf(Math.max(z.C[0],z.C[2]));
const onde=z.T[2]>avg('T',2)+.02?`fica muito no campo de ataque: ${p(z.T[2])} das ações acontecem no terço ofensivo (${rk('T',2)}º da liga; média ${p(avg('T',2))})`:z.T[0]>avg('T',0)+.02?`passa bastante tempo no próprio campo: ${p(z.T[0])} das ações no terço defensivo (média ${p(avg('T',0))})`:`distribui as ações entre os terços perto da média da liga (${p(z.T[0])} defesa, ${p(z.T[1])} meio, ${p(z.T[2])} ataque)`;
const lado=Math.abs(z.C[0]-z.C[2])<.02?`usa os dois lados por igual (${p(z.C[0])} direito, ${p(z.C[2])} esquerdo) e ${p(z.C[1])} pelo corredor central`:`puxa as jogadas pelo lado ${lados[li]} (${p(z.C[li])} contra ${p(z.C[2-li])} do outro) e ${p(z.C[1])} pelo corredor central`;
const cmp=(v,l)=>v>l+.03?'acima da liga':v<l-.03?'abaixo da liga':'perto da liga';
const M=key=>{const v=D.times.map(x=>x.kpi[key]).filter(x=>x!=null);return v.reduce((a,b)=>a+b,0)/v.length};
return `Com a bola, o ${esc(t.nome)} ${onde}, e ${lado}. Nos gols de jogada, ${p(k.faixa)} passam pela faixa lateral (${cmp(k.faixa,M('faixa'))}: ${p(M('faixa'))}), ${p(k.longa)} nascem de bola longa (${cmp(k.longa,M('longa'))}: ${p(M('longa'))}) e ${p(k.alta)} começam com a posse retomada no campo de ataque (${cmp(k.alta,M('alta'))}: ${p(M('alta'))}). Do total de gols, ${p(k.contra)} saem de contra-ataque (liga ${p(M('contra'))}) e ${p(k.bola_parada)} de bola parada (liga ${p(M('bola_parada'))}).`}
function conclusao(t){const z=e=>{const x=t.eixos.find(a=>a.eixo===e);return x?x.valor_z:0};const Z=zonas(t.calor),k=t.kpi,n=t.nome;const fr=[];
fr.push(z('posse_e_construcao')>.5?`O ${n} gosta de ficar com a bola e trocar passes`:z('jogo_direto')>.5?`O ${n} prefere lançar a bola longa e chegar rápido ao ataque`:z('posse_e_construcao')<-.5?`O ${n} não faz questão da bola: deixa o rival com ela e joga em velocidade quando recupera`:`O ${n} alterna troca de passes com jogadas mais diretas`);
fr[0]+=z('dominio_territorial')>.5?', quase sempre perto da área adversária.':z('dominio_territorial')<-.5?', mas passa boa parte do jogo no próprio campo.':'.';
const lados=Z&&Math.abs(Z.C[0]-Z.C[2])<.02?'pelos dois lados do campo':Z?`principalmente pelo lado ${Z.C[0]>Z.C[2]?'direito':'esquerdo'}`:'pelos lados';
const pontas=z('ataque_pelas_pontas')>.5||k.faixa>.55;
fr.push(z('bola_na_frente')>.5?`Para criar, ${pontas?'abre o jogo com laterais e pontas '+lados+' e':'troca passes '+lados+' e'} procura o passe enfiado para um atacante entrar nas costas da defesa.`:pontas?`Para criar, leva a bola ${lados} com laterais e pontas e busca o cruzamento ou o passe para dentro da área.`:`Para criar, circula a bola ${lados} até achar espaço por dentro.`);

const vo=z('volume_ofensivo'),sd=z('solidez_defensiva');fr.push(vo>.5&&sd>.5?'O resultado é um time que cria muito e cede pouco.':vo>.5?'Cria bastante, mas também cede chances ao rival.':sd>.5?'Cria pouco, mas é difícil de ser vazado.':vo<-.5&&sd<-.5?'Hoje cria pouco e cede muito: o modelo de jogo não está funcionando.':'O saldo de chances fica perto da média da liga.');
return fr.join(' ')}

const estCard=`<div class="card"><h2>Limite de estrangeiros da CBF</h2><div class="sub">Regra aprovada em 21/09/2026: máximo de estrangeiros <b>relacionados por partida</b> cai de 9 (2026) para 5 (2030). Abaixo, quantos estrangeiros o elenco tem hoje (descontando os que você marcar para venda) contra o limite de cada ano. Com mais estrangeiros que o limite, os excedentes não podem ser relacionados juntos.</div><div style="display:flex;flex-wrap:wrap;gap:10px;margin:12px 0">${limRow}</div><div class="sub">Estrangeiros ordenados pelo valor para o time (encaixe no estilo). Os do fim da fila são os primeiros a ficar de fora quando o limite cai. Para cada um, o brasileiro recomendado que rende mais na mesma função e cabe na verba de 2026.</div>${estRows||'<div class="note">O elenco não tem estrangeiros.</div>'}<div class="note">Nacionalidade do cadastro do SofaScore. Brasileiros com outra nacionalidade (ex.: Jorginho, Lucas Piton, Rafael Tolói) contam como brasileiros pela lista manual brasileiros_dupla_nacionalidade.csv.</div></div>`;

<div class="row"><div class="card" style="flex:2 1 640px;min-width:0"><h2>Formação ${esc(t.formacao)}: titulares e opções do elenco</h2><div class="sub">Carta = titular da vaga · etiquetas embaixo = elenco da mesma posição (lateral e ponta: mesmo lado) · verde-limão = contratado na janela.</div><div style="margin-top:12px">${sairBox}${campo}</div>${lanes}</div><div class="card" style="flex:1 1 340px;min-width:0;position:sticky;top:12px">${lado_}</div></div>
${mercadoAll}${missoes}${estCard}<details${S.mais?' open':''} id="maisd" class="card"><summary style="margin:0">Lista de vendas (${aptos.length} indicados pela análise · ${outros.length} outros)</summary><div class="sub" style="margin-top:8px">Indicados: brasileiros com pouca minutagem e mais de 22 anos. Estrangeiros ficam no quadro do limite da CBF.</div><div class="mk">${aptos.map(sell).join('')||'<span class="note">Nenhum indicado com valor conhecido.</span>'}</div><b style="display:block;margin-top:12px;font-size:14px">Outros do elenco</b><div class="mk">${outros.map(sell).join('')}</div>${(()=>{const em=uniqId(t.jogadores.filter(j=>j.emprestado));return em.length?`<div class="note">🔁 <b>Emprestados ao clube, fora da venda (${em.length}):</b> ${em.map(j=>esc(j.nome_jogador)+' ('+esc(j.clube_dono||'?')+')').join(', ')}. Não pertencem ao clube: o caminho é renovar o empréstimo, comprar do dono ou devolver.</div>`:''})()}${novos.length?`<div class="note">🔒 <b>Recém-contratados, fora da venda (${novos.length}):</b> ${novos.map(j=>esc(j.nome_jogador)).join(', ')}.</div>`:''}</details>`}

document.querySelectorAll('.xs').forEach(b=>b.onclick=()=>{const xi=S.xi[S.id]||(S.xi[S.id]={}),i=Number(b.dataset.i),id=Number(b.dataset.id),t0=D.times.find(x=>x.id===S.id);if(t0.lineup[i].id===id)delete xi[i];else xi[i]=id;S.animX=id;S.slot=null;render()});
